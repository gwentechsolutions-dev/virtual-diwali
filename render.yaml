# Optional free backend blueprint. Local room data is lost on sleep/restart.
services:
  - type: web
    name: virtual-diwali-multiplayer
    runtime: node
    plan: free
    repo: https://github.com/gwentechsolutions-dev/virtual-diwali
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: PUBLIC_ORIGIN
        value: https://virtual-diwali.vercel.app
      - key: DATA_DIR
        value: /tmp/virtual-diwali-rooms
